name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew setupCIWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MCECapes-1.8.9
          path: build/libs/*.jar
